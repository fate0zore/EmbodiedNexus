[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-nexus-camera-client"
version = "0.1.0"
description = "WebSocket and HTTP client for EmbodiedNexus camera services"
requires-python = ">=3.10"
dependencies = ["websockets>=12"]

[tool.setuptools.packages.find]
where = ["."]
