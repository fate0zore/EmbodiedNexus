device_id: arm_main
model: aubo_i5
backend: ros2_sim
backend_options:
  namespace: /sim/arachne
  joint_states_topic: /sim/arachne/joint_states
  arm_trajectory_topic: /sim/arachne/arm_controller/joint_trajectory
interface_mode: ros2
joints:
  names: [aubo_shoulder_joint, aubo_upperArm_joint, aubo_foreArm_joint, aubo_wrist1_joint, aubo_wrist2_joint, aubo_wrist3_joint]
  min_rad: [-6.28318530718, -6.28318530718, -6.28318530718, -6.28318530718, -6.28318530718, -6.28318530718]
  max_rad: [6.28318530718, 6.28318530718, 6.28318530718, 6.28318530718, 6.28318530718, 6.28318530718]
motion:
  max_speed_rad_sec: 0.25
  max_acceleration_rad_sec2: 0.45
  speed_joint_acceleration_rad_sec2: 2.0
  stop_acceleration_rad_sec2: 8.0
  speed_joint_duration_sec: 100.0
  watchdog_sec: 0.75
  operation_timeout_sec: 30.0
  goal_tolerance_rad: 0.04
  stable_sec: 0.25
  servo_joint_command_period_sec: 0.20
  servo_joint_velocity_rad_sec: 0.2
  servo_joint_acceleration_rad_sec2: 0.2
  servo_joint_period_sec: 0.008
  servo_joint_lookahead_sec: 0.12
  servo_joint_gain: 150
feedback:
  rate_hz: 20.0
  stale_sec: 1.0
control:
  lease_ttl_sec: 2.0
  max_lease_ttl_sec: 30.0
teach:
  method: freedrive
web:
  bind_host: 127.0.0.1
  port: 8779
  auth_token_env: EMBODIED_NEXUS_DEVICE_TOKEN
