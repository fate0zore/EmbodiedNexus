use_gazebo: false
command_in_type: speed_units
scale: {linear: 0.1, rotational: 0.2, joint: 0.2}
publish_period: 0.1
low_latency_mode: false
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: false
publish_joint_velocities: true
publish_joint_accelerations: false
smoothing_filter_plugin_name: embodied_nexus_dynamic_grasp::PassthroughFilter
is_primary_planning_scene_monitor: false
move_group_name: manipulator
# Humble Servo applies its Cartesian increment in the KDL solver base frame.
# Aubo is mounted 90 degrees from base_link; use the solver base here so that
# Servo rotates base_link-stamped velocity commands before applying them.
planning_frame: aubo_base_link
ee_frame_name: grasp_frame
robot_link_command_frame: base_link
incoming_command_timeout: 0.5
num_outgoing_halt_msgs_to_publish: 0
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.1
leaving_singularity_threshold_multiplier: 2.0
cartesian_command_in_topic: /embodied_nexus/dynamic_grasp/twist
joint_command_in_topic: /embodied_nexus/dynamic_grasp/joint_jog
joint_topic: /sim/arachne/joint_states
status_topic: /embodied_nexus/dynamic_grasp/servo_status
command_out_topic: /embodied_nexus/dynamic_grasp/joint_command
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.005
