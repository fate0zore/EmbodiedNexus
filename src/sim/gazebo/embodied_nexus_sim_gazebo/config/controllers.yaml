"/sim/arachne/controller_manager":
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    base_controller:
      type: diff_drive_controller/DiffDriveController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

"/sim/arachne/base_controller":
  ros__parameters:
    left_wheel_names: [front_left_wheel, rear_left_wheel]
    right_wheel_names: [front_right_wheel, rear_right_wheel]
    wheel_separation: 0.58306
    wheel_radius: 0.16459
    position_feedback: true
    open_loop: false
    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_footprint
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    use_stamped_vel: true

"/sim/arachne/arm_controller":
  ros__parameters:
    joints:
      - aubo_shoulder_joint
      - aubo_upperArm_joint
      - aubo_foreArm_joint
      - aubo_wrist1_joint
      - aubo_wrist2_joint
      - aubo_wrist3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      aubo_shoulder_joint: {trajectory: 0.08, goal: 0.04}
      aubo_upperArm_joint: {trajectory: 0.08, goal: 0.04}
      aubo_foreArm_joint: {trajectory: 0.08, goal: 0.04}
      aubo_wrist1_joint: {trajectory: 0.08, goal: 0.04}
      aubo_wrist2_joint: {trajectory: 0.08, goal: 0.04}
      aubo_wrist3_joint: {trajectory: 0.08, goal: 0.04}

"/sim/arachne/gripper_controller":
  ros__parameters:
    joints: [ms42dc_left_finger_joint, ms42dc_right_finger_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      ms42dc_left_finger_joint: {trajectory: 0.05, goal: 0.02}
      ms42dc_right_finger_joint: {trajectory: 0.05, goal: 0.02}
