core:
  bind_host: 0.0.0.0
  port: 8780
  auth_token_env: EMBODIED_NEXUS_CORE_TOKEN
visualization:
  enabled: true
  port: 9091
  robot_model:
    # MuJoCo launch already publishes the calibrated robot description and TF.
    enabled: false
    joint_states_topic: /sim/arachne/joint_states
devices:
  - id: base_main
    type: base
    config: package://embodied_nexus_base/config/scout_sim.yaml
    enabled: true
    use_sim_time: true
  - id: arm_main
    type: arm
    config: package://embodied_nexus_arm/config/aubo_i5_sim.yaml
    enabled: true
    use_sim_time: true
  - id: gripper_main
    type: gripper
    config: package://embodied_nexus_gripper/config/ms42dc_sim.yaml
    enabled: true
    use_sim_time: true
  - id: camera_front
    type: camera
    config: package://embodied_nexus_camera/config/gemini335_sim.yaml
    enabled: true
    use_sim_time: true
  - id: lidar_main
    type: lidar
    config: package://embodied_nexus_lidar/config/c16_sim.yaml
    enabled: true
    use_sim_time: true
