device_id: gripper_main
model: ms42dc
backend: ros2_sim
backend_options:
  namespace: /sim/arachne
  joint_states_topic: /sim/arachne/joint_states
  gripper_trajectory_topic: /sim/arachne/gripper_controller/joint_trajectory
  gripper_joint_names: [ms42dc_left_finger_joint, ms42dc_right_finger_joint]
  finger_travel_rad: 0.6
  speed_at_150_rad_sec: 0.6
interface_mode: both
protocol:
  device_id: 1
  sub_divide: 32
  mode: 2
motion:
  open_angle_tenths: 19656
  close_angle_tenths: 19656
  max_relative_angle_tenths: 65535
feedback:
  poll_interval_sec: 0.05
  stale_sec: 1.0
  reached_value: 1
  moving_value: 0
  require_moving_transition: true
  confirmed: true
control:
  operation_timeout_sec: 10.0
  lease_ttl_sec: 2.0
  lease_renew_interval_sec: 0.5
  max_lease_ttl_sec: 30.0
  speed_tenths: 150
web:
  bind_host: 127.0.0.1
  port: 8776
  auth_token_env: EMBODIED_NEXUS_DEVICE_TOKEN
