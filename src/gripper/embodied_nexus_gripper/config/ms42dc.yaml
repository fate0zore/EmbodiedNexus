device_id: gripper_main
model: ms42dc
backend: serial
interface_mode: both

serial:
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_58EB003416-if00
  baudrate: 115200
  timeout_sec: 0.25
  reconnect_backoff_sec: 1.0

protocol:
  device_id: 1
  sub_divide: 32
  mode: 2

motion:
  open_angle_tenths: 19656
  close_angle_tenths: 19656
  max_relative_angle_tenths: 65535

feedback:
  poll_interval_sec: 0.05
  stale_sec: 1.0
  reached_value: 1
  moving_value: 0
  require_moving_transition: false
  # Operator-confirmed feedback mapping for this physical gripper.
  confirmed: true

control:
  operation_timeout_sec: 10.0
  lease_ttl_sec: 2.0
  lease_renew_interval_sec: 0.5
  max_lease_ttl_sec: 30.0
  speed_tenths: 150

mock:
  move_duration_sec: 0.2
  fail_feedback: false
  fail_stop: false
  disconnect: false

web:
  bind_host: 0.0.0.0
  port: 8776
  auth_token_env: EMBODIED_NEXUS_GRIPPER_TOKEN
